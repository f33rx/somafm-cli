name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        test-type: [unit, integration]
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install mpv
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y mpv
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install mpv
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -c "Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force"
            powershell -c "irm get.scoop.sh -outfile 'install.ps1'"
            powershell -c ".\install.ps1 -RunAsAdmin"
            "$USERPROFILE/scoop/shims/scoop" install mpv
            echo "$USERPROFILE\scoop\shims" >> "$GITHUB_PATH"
          fi

      - name: Run ${{ matrix.test-type }} tests
        shell: bash
        run: make test-${{ matrix.test-type }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.test-type }}-test-logs-${{ matrix.os }}
          path: build/var/log/
          if-no-files-found: ignore
